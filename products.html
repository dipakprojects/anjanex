<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjanex | All Products</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="ambient-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <div id="header-placeholder"></div>

    <section class="section" style="padding-top: 10rem; min-height: 85vh;">
        <h2 class="section-title">Our Complete Range</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 3rem;">Browse our full selection of premium kitchen appliances.</p>
        
        <!-- Dynamic Products Placeholder (No data-limit means it loads all) -->
        <div class="product-grid" id="product-grid">
            <p style="text-align:center; color: #94a3b8; grid-column: 1/-1;">Loading products from CSV...</p>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="js/script.js"></script>

</body>
</html>
